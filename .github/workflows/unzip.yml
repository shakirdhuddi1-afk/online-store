name: unzip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f"
              git rm -q -f "$f"
            fi
          done
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "unzip files"
          git push
