<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1B3D">
<title>LUX Online Store — Smart gadgets for your home</title>
<meta name="description" content="Hand-picked kitchen and lifestyle gadgets delivered to the US, UK, Saudi Arabia and Pakistan.">
<meta property="og:title" content="LUX Online Store"><meta property="og:type" content="website">
<meta property="og:description" content="Hand-picked kitchen and lifestyle gadgets for your home.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
/* Concept: premium tech-lifestyle store. Midnight navy + gold on warm paper. Big gold-ringed circle posters, cinematic hero slider, living product media. */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#0B1226; --head:#0F1B3D; --muted:#5E6984; --line:#E6E1D4;
  --navy:#0F1B3D; --navy2:#1B2C5E; --gold:#C9A24A; --gold-soft:#F3E3B5; --gold-ink:#7C5E17;
  --btn:#0F1B3D; --btn-ink:#FFFFFF; --red:#D93A44; --green:#12A150;
  --hero-a:#FBF9F3; --hero-b:#E5DEC9; --chip:rgba(255,255,255,.94); --chip-ink:#0F1B3D;
  --shadow:rgba(15,27,61,.55); --soft:#FAF8F3;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-ar:'Cairo','Plus Jakarta Sans',system-ui,sans-serif; --f-serif:'Playfair Display','Caladea',Georgia,serif;
  --gx:max(16px, env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080D1C; --surface:#111933; --ink:#EEF1FA; --head:#F1E7C6; --muted:#9BA7C7; --line:#222E58; --soft:#0D1530;
  --btn:#C9A24A; --btn-ink:#0F1B3D; --hero-a:#121B3A; --hero-b:#0B1228; --chip:rgba(17,25,51,.92); --chip-ink:#F1E7C6; --gold-ink:#E6C675; --shadow:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080D1C; --surface:#111933; --ink:#EEF1FA; --head:#F1E7C6; --muted:#9BA7C7; --line:#222E58; --soft:#0D1530;
  --btn:#C9A24A; --btn-ink:#0F1B3D; --hero-a:#121B3A; --hero-b:#0B1228; --chip:rgba(17,25,51,.92); --chip-ink:#F1E7C6; --gold-ink:#E6C675; --shadow:rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);overflow-x:hidden;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--navy)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
svg{display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:1296px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{overflow:hidden;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.dsk{display:none!important}

/* ---------- announcement + header ---------- */
.ann{background:var(--navy);color:#EBDDB2;font-size:12px;font-weight:700;letter-spacing:.3px;height:36px;position:relative;overflow:hidden;padding-top:0}
.ann div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;opacity:0;transform:translateY(8px);transition:.5s;padding:0 12px;white-space:nowrap}
.ann div.on{opacity:1;transform:none}
.ann i{color:var(--gold);font-style:normal}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1296px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .w{font-weight:800;font-size:19px;letter-spacing:3.2px;color:var(--head);direction:ltr;line-height:1}
.brand .w small{display:block;font-size:7.5px;letter-spacing:2.7px;color:var(--gold-ink);font-weight:700;margin-top:4px}
.ibtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--head)}
.ibtn:hover{background:var(--soft)}
.ibtn b{position:absolute;top:2px;inset-inline-end:0;background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;font-weight:800;padding:0 4px}
.hact{display:flex;align-items:center;gap:4px}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800;background:var(--surface);color:var(--head);white-space:nowrap}
.flag{width:19px;height:19px;border-radius:50%;background:var(--navy);color:var(--gold-soft);font-size:7.5px;display:grid;place-items:center;font-weight:800;letter-spacing:.2px;flex:none}
.nav{display:flex;gap:28px;font-weight:700;font-size:14px;color:var(--head)}
.nav a{padding:6px 0;border-bottom:2px solid transparent}.nav a:hover,.nav a.a{border-color:var(--gold)}
.srch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--soft);border-radius:99px;padding:10px 16px;min-width:240px;font-size:13px;color:var(--muted);text-align:start}

/* ---------- hero slider ---------- */
.hero{padding-top:12px}
.hs{position:relative;border-radius:26px;overflow:hidden;min-height:610px;box-shadow:0 30px 50px -34px var(--shadow);background:var(--navy);touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.slide.on{opacity:1;visibility:visible}
.sl-in{position:relative;height:100%;display:flex;flex-direction:column}
.s1{background:radial-gradient(120% 90% at 85% 10%,var(--hero-a),var(--hero-b));color:var(--head)}
.s2{background:radial-gradient(110% 80% at 80% 20%,#26408A,#0F1B3D 62%,#0A1230);color:#fff}
.s3{background:linear-gradient(150deg,#F7EBC6,#E0C170 70%,#CDA64E);color:#0F1B3D}
.sl-t{padding:26px 22px 0;position:relative;z-index:5}
.kick{display:inline-flex;gap:9px;align-items:center;font-size:11px;font-weight:800;letter-spacing:2.2px;color:var(--gold-ink)}
.kick:before{content:"";width:24px;height:2px;background:var(--gold)}
.s2 .kick{color:var(--gold)}.s3 .kick{color:#6B4E10}
.sl h1,.sl h2.hh{font-size:clamp(34px,9.6vw,44px);line-height:1.04;font-weight:800;letter-spacing:-1.4px;margin:12px 0 10px}
.sl h1 em,.sl h2.hh em{font-style:italic;font-family:var(--f-serif);font-weight:800;color:#B3841B;letter-spacing:-.5px}
.s2 em{color:var(--gold)!important}.s3 em{color:#fff!important;text-shadow:0 2px 0 rgba(120,84,10,.35)}
.sl p{font-size:14.5px;color:var(--muted);max-width:440px}
.s2 p{color:#B9C6EA}.s3 p{color:#4B3A12}
.sbtns{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.cta{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-ink);font-weight:800;font-size:14px;border-radius:99px;padding:14px 26px;transition:transform .2s,box-shadow .2s;box-shadow:0 14px 24px -14px var(--shadow)}
.cta:hover{transform:translateY(-2px)}
.cta:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.6s infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.cta.gold{background:var(--gold);color:#0F1B3D}.s2 .cta{background:var(--gold);color:#0F1B3D}.s3 .cta{background:#0F1B3D;color:#fff}
.lnk{font-size:14px;font-weight:800;border-bottom:2px solid var(--gold);padding-bottom:2px}
.sl-v{position:relative;flex:1;min-height:330px}
/* slide 1 visual */
.arch{position:absolute;inset-inline:0;margin:auto;bottom:34px;width:min(76%,320px);aspect-ratio:4/4.6;border-radius:999px 999px 26px 26px;overflow:hidden;box-shadow:0 34px 50px -26px var(--shadow);transform-style:preserve-3d;transition:transform .15s}
.arch img{width:100%;height:100%;object-fit:cover;object-position:46% 60%;transform:scale(1.04);animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.14) translateY(-1%)}}
.ring{position:absolute;inset-inline:0;margin:auto;bottom:22px;width:min(76%,320px);aspect-ratio:4/4.6;border:2px solid var(--gold);border-radius:999px 999px 26px 26px;transform:translate(14px,-14px);opacity:.8}
.orb{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.5),transparent 68%);inset-inline-end:-60px;top:-20px;filter:blur(6px);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.8}}
.fchip{position:absolute;z-index:6;background:var(--chip);color:var(--chip-ink);border-radius:13px;padding:9px 13px;font-size:12px;font-weight:800;box-shadow:0 12px 24px -12px var(--shadow);display:flex;gap:8px;align-items:center;animation:float 5s ease-in-out infinite;white-space:nowrap}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(18,161,80,.18)}
@keyframes float{50%{transform:translateY(-8px)}}
.seal{position:absolute;z-index:7;width:112px;height:112px;inset-inline-end:14px;top:6px}
.seal .disc{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#EBCB80,#B88A22);display:grid;place-items:center;text-align:center;color:#0F1B3D;font-weight:800;font-size:10px;line-height:1;box-shadow:0 14px 26px -10px rgba(120,84,10,.8)}
.seal .disc b{display:block;font-size:25px;letter-spacing:-1px;margin:2px 0}
.seal svg.ro{position:absolute;inset:0;width:100%;height:100%;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seal text{font-size:11.4px;font-weight:800;letter-spacing:2.2px;fill:var(--head)}
/* slide 2 */
.dockbox{position:absolute;inset-inline:0;margin:auto;bottom:30px;width:min(86%,400px);aspect-ratio:1.1/1;direction:ltr}
.dockwrap{position:absolute;inset:0;border-radius:24px;overflow:hidden;box-shadow:0 0 0 2px rgba(201,162,74,.6),0 40px 60px -30px #000}
.dockwrap img{width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate}
.co{position:absolute;z-index:6;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;background:rgba(15,27,61,.82);backdrop-filter:blur(6px);color:#F3E3B5;border:1px solid rgba(201,162,74,.6);padding:6px 10px;border-radius:99px;white-space:nowrap;transform:translate(-100%,-50%);flex-direction:row-reverse}
.co:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(201,162,74,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(201,162,74,0)}100%{box-shadow:0 0 0 0 rgba(201,162,74,0)}}
/* slide 3 compare */
.cmpw{position:absolute;inset-inline:0;margin:auto;bottom:30px;width:min(86%,400px);aspect-ratio:1/1.05;border-radius:24px;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.7),0 36px 50px -28px rgba(80,55,5,.9);direction:ltr;user-select:none;touch-action:pan-y;cursor:ew-resize}
.cmpw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%;pointer-events:none}
.cmpw .top{clip-path:inset(0 0 0 var(--p,50%))}
.cmpw .knob{position:absolute;top:0;bottom:0;left:var(--p,50%);width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 14px rgba(0,0,0,.4)}
.cmpw .knob:after{content:"\2194";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;color:#0F1B3D;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 10px 20px -6px rgba(0,0,0,.5)}
.cmpw .lb{position:absolute;top:12px;font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:99px;color:#fff}
.cmpw .lb.l{left:12px;background:var(--red)}.cmpw .lb.r{right:12px;background:var(--green)}
/* slider chrome */
.sdots{position:absolute;bottom:12px;inset-inline:0;z-index:12;display:flex;justify-content:center;gap:8px}
.sdots button{width:9px;height:9px;border-radius:99px;background:rgba(127,127,127,.55);overflow:hidden;position:relative;transition:width .3s}
.sdots button.on{width:38px;background:rgba(127,127,127,.4)}
.sdots button.on:after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:prog var(--dur,7s) linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sarr{position:absolute;top:50%;z-index:12;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);color:#0F1B3D;display:none;place-items:center;box-shadow:0 10px 20px -8px rgba(0,0,0,.5)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-size:10.5px;font-weight:700;line-height:1.3;color:var(--head)}
.strip .i{width:34px;height:34px;border-radius:11px;background:var(--navy);margin:0 auto 7px;display:grid;place-items:center}

/* ---------- section heads ---------- */
.sh{text-align:center;padding:42px 0 6px}
.sh .k{font-size:11px;letter-spacing:2.6px;font-weight:800;color:var(--gold-ink)}
.sh h2{font-size:clamp(28px,7.6vw,42px);font-weight:800;letter-spacing:-.8px;margin-top:6px;color:var(--head);line-height:1.12}
.sh p{font-size:14px;color:var(--muted);margin:8px auto 0;max-width:520px}

/* ---------- circle posters (auto-scroll) ---------- */
.cats{display:flex;gap:20px;margin-inline:-16px;padding:26px 16px 40px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.circle{--d:min(76vw,310px);flex:none;width:var(--d);height:var(--d);border-radius:50%;position:relative;overflow:hidden;scroll-snap-align:center;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold),0 30px 34px -22px var(--shadow);cursor:pointer;text-align:center;transition:transform .35s}
.circle:hover{transform:translateY(-6px) scale(1.015)}
.circle:before{content:"";position:absolute;inset:11px;border:1.5px dashed rgba(201,162,74,.65);border-radius:50%;z-index:3;pointer-events:none}
.cd{background:radial-gradient(circle at 50% 0%,#2A3F7E,#0F1B3D 70%)}
.cg{background:linear-gradient(160deg,#F7EBC6,#E0C170)}
.cc{background:linear-gradient(160deg,#F7F2E5,#E4DBC0)}
.ct{position:absolute;top:12%;left:0;right:0;z-index:2;font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:calc(var(--d)*.115);line-height:1.04}
.ct small{display:block;font-family:var(--f-body);font-style:normal;font-size:calc(var(--d)*.031);letter-spacing:.32em;margin-top:.9em;font-weight:800}
.cd .ct{color:var(--gold-soft)}.cd .ct small{color:var(--gold)}
.cg .ct,.cc .ct{color:#0F1B3D}.cg .ct small{color:#6B4E10}.cc .ct small{color:#7C5E17}
.cim{position:absolute;inset:auto 0 0 0;height:55%;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 42%);mask-image:linear-gradient(to bottom,transparent 0,#000 42%);transition:transform .8s}
.circle:hover .cim{transform:scale(1.07)}
.cart-art{position:absolute;inset:auto 0 0 0;height:55%;display:grid;place-items:center;padding-top:12%}
.go{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);background:#fff;color:#0F1B3D;font-size:calc(var(--d)*.04);font-weight:800;border-radius:99px;padding:.55em 1.3em;z-index:4;box-shadow:0 10px 18px -8px rgba(0,0,0,.5);white-space:nowrap}
.go.soon{background:rgba(255,255,255,.18);color:inherit;box-shadow:none;border:1px solid currentColor;backdrop-filter:blur(4px)}
.cdots{display:flex;gap:6px;justify-content:center;margin-top:-18px;padding-bottom:6px}
.cdots button{width:8px;height:8px;border-radius:99px;background:var(--line);transition:.3s}.cdots button.on{width:26px;background:var(--navy)}
:root[data-theme="dark"] .cdots button.on{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cdots button.on{background:var(--gold)}}

/* ---------- ribbon ---------- */
.ribbon{margin:36px -8% 30px;transform:rotate(-2deg);background:linear-gradient(90deg,#0F1B3D,#22367A,#0F1B3D);color:#fff;padding:15px 0;border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);overflow:hidden;white-space:nowrap}
.rtrack{display:inline-flex;gap:26px;align-items:center;font-weight:800;letter-spacing:2px;font-size:13px;animation:marq 26s linear infinite;padding-inline-start:26px}
.rtrack i{color:var(--gold);font-style:normal}.rtrack b{color:var(--gold-soft)}
.rtrack .pct{width:26px;height:26px;border-radius:7px;background:var(--gold);color:#0F1B3D;display:grid;place-items:center;font-size:14px}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- products ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:0 22px 30px -28px var(--shadow);position:relative;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s;cursor:pointer}
.card:hover{transform:translateY(-4px)}
.media{position:relative;aspect-ratio:1/1.05;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #EFEBDD;isolation:isolate}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}
.media img.on,.media video.on{opacity:1}
.media.playing img.on{animation:kb2 6s ease-out forwards}
@keyframes kb2{from{transform:scale(1)}to{transform:scale(1.09)}}
.mbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(15,27,61,.15);z-index:3}
.mbar i{display:block;height:100%;width:0;background:var(--gold)}
.media.playing .mbar i{animation:mb var(--mt,5400ms) linear infinite}
@keyframes mb{to{width:100%}}
.live{position:absolute;inset-inline-start:8px;bottom:12px;z-index:3;display:flex;align-items:center;gap:6px;background:rgba(15,27,61,.82);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.8px;border-radius:99px;padding:4px 8px 4px 7px;opacity:0;transition:.4s}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#FF4D55;animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{opacity:.3}}
.media.playing .live{opacity:1}
.tag{position:absolute;inset-inline-start:8px;top:8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:7px;padding:3px 8px;z-index:3;letter-spacing:.3px}
.tag.nv{background:var(--navy);color:#F3E3B5}
.qi{position:absolute;inset-inline-end:8px;bottom:12px;display:flex;gap:6px;z-index:3}
.qi button{width:32px;height:32px;border-radius:50%;background:#fff;color:#0F1B3D;box-shadow:0 6px 12px -4px rgba(0,0,0,.4);display:grid;place-items:center}
.qi button.on svg{fill:var(--red);stroke:var(--red)}
.card .n{font-weight:800;font-size:13px;line-height:1.3;color:var(--head);margin-top:11px;min-height:34px}
.pr{margin:6px 0 10px;font-size:15px;font-weight:800;color:var(--red);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pr s{color:var(--muted);font-size:12px;font-weight:600;opacity:.8}
.pr em{font-style:normal;background:rgba(18,161,80,.14);color:var(--green);font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px}
.qa{margin-top:auto;display:block;width:100%;text-align:center;border:1.5px solid var(--head);color:var(--head);font-weight:800;font-size:12.5px;border-radius:12px;padding:10px;transition:.2s}
.qa:hover{background:var(--head);color:var(--bg)}
.card.soon{cursor:default;border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;padding:24px 14px;gap:10px;color:var(--muted);min-height:260px}
.card.soon:hover{transform:none}
.card.soon .ico{width:54px;height:54px;border-radius:50%;border:1.5px dashed var(--gold);display:grid;place-items:center;color:var(--gold-ink)}
.card.soon b{color:var(--head);font-size:14px}.card.soon span{font-size:12px}

/* ---------- posters / why ---------- */
.posters{display:grid;gap:14px;padding-top:40px}
.poster{position:relative;border-radius:24px;overflow:hidden;height:220px;box-shadow:0 22px 34px -26px var(--shadow)}

  hs.addEventListener("pointerup",e=>{if(x0===null)return;const dx=e.clientX-x0;if(Math.abs(dx)>50){sw=true;go(idx+(dx<0?1:-1))}x0=null});
