<head>

<style>
:root{--ink:#10201c;--mut:#5d6b66;--bg:#f6f8f7;--card:#fff;--line:#e3e9e6;--pri:#0b5d4b;--pri2:#084a3c;--hi:#e8ff6a;--red:#d63f3f;--r:18px}
@media(prefers-color-scheme:dark){:root{--ink:#eef4f1;--mut:#9fb0a9;--bg:#0c1512;--card:#14201c;--line:#24352f;--pri:#2fbf9b;--pri2:#27a888}}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;overflow-x:hidden}
body{font:400 16px/1.55 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}section{padding:44px 0}
h2{font-size:clamp(24px,4vw,36px);margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:700;background:var(--pri);color:#fff;transition:.2s}
.btn:hover{background:var(--pri2);transform:translateY(-1px)}.btn.o{background:transparent;color:var(--ink);border:2px solid var(--line)}.btn.o:hover{border-color:var(--pri)}
.btn.hi{background:var(--hi);color:#10201c}.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
/* header */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;height:66px}.logo{font-size:24px;font-weight:800;color:var(--pri)}
.search{flex:1;max-width:520px;display:none}.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 18px}
.ic{width:44px;height:44px;border-radius:50%;background:transparent;font-size:20px;position:relative;display:grid;place-items:center}.ic:hover{background:var(--line)}
.ic em{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font:700 11px/1 'DM Sans';border-radius:99px;padding:3px 5px;font-style:normal}
.nav{display:none;gap:22px;font-weight:500}.nav a:hover{color:var(--pri)}.sp{flex:1}
select.cs{height:40px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 10px}
#mm{display:none;padding:10px 16px 18px;border-top:1px solid var(--line)}#mm.on{display:block}#mm a{display:block;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:500}
#mm .search{display:block;max-width:none;margin-bottom:8px}
@media(min-width:900px){.search{display:block}.nav{display:flex}#hb{display:none}#mm{display:none!important}}
/* hero */
.hero{padding:34px 0 20px}.hg{display:grid;gap:30px;align-items:center}
.hero h1{font-size:clamp(36px,7vw,68px);font-weight:800;letter-spacing:-.02em}.hero h1 span{background:var(--hi);color:#10201c;padding:0 .15em;border-radius:.15em}
.hero p{color:var(--mut);font-size:18px;margin:18px 0 24px;max-width:520px}.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;font-weight:500;font-size:14px}.trust b{color:var(--pri)}
.collage{position:relative;height:340px}.collage a{position:absolute;width:46%;background:var(--card);border-radius:var(--r);padding:8px;box-shadow:0 18px 40px #0a2a2230;transition:.3s}
.collage a:nth-child(1){left:2%;top:10%;transform:rotate(-5deg)}.collage a:nth-child(2){right:2%;top:0;transform:rotate(4deg)}.collage a:nth-child(3){left:26%;bottom:0;transform:rotate(-1deg)}
.collage a:hover{transform:scale(1.04) rotate(0);z-index:3}.collage small{display:block;padding:6px 4px 2px;font-weight:700;font-size:13px}
@media(min-width:900px){.hg{grid-template-columns:1.1fr .9fr}.collage{height:460px}}
/* cards & grids */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:640px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:1.15;display:block;transition:.25s}.cat:hover{transform:translateY(-4px)}
.cat img{width:100%;height:100%;object-fit:cover}.cat b{position:absolute;left:12px;bottom:10px;right:12px;color:#fff;font:800 17px 'Bricolage Grotesque';text-shadow:0 2px 8px #0008}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.hs{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding-bottom:10px}.hs .card{flex:0 0 68%;scroll-snap-align:start}
@media(min-width:640px){.hs{display:grid;overflow:visible}.hs .card{flex:none}}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column;transition:.25s}.card:hover{box-shadow:0 14px 34px #0a2a2218;transform:translateY(-3px)}
.im{display:block;aspect-ratio:1;background:var(--line);position:relative;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.bd{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px}.bd i{font:700 10px/1 'DM Sans';letter-spacing:.04em;padding:5px 8px;border-radius:99px;background:var(--red);color:#fff;font-style:normal}.bd i.t{background:var(--hi);color:#10201c}
.heart{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--card);font-size:18px;color:var(--mut);box-shadow:0 2px 8px #0002}.heart.on{color:var(--red)}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.cb h3{font-size:15px;font-weight:600;font-family:'DM Sans';line-height:1.3}
.rt{font-size:13px;color:var(--mut)}.rt b{color:#e0a100}.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.pr b{font-size:18px}.pr s{color:var(--mut);font-size:13px}.pr i{color:var(--red);font:700 12px 'DM Sans'}
.bt{display:grid;gap:6px;margin-top:auto;padding-top:6px}
/* deal */
.deal{background:var(--pri);color:#fff;border-radius:28px;padding:36px 22px;text-align:center}.deal h2{margin-bottom:8px}.deal p{opacity:.85;margin-bottom:20px}
.cd{display:flex;justify-content:center;gap:10px;margin-bottom:22px}.cd div{background:#ffffff1c;border-radius:14px;min-width:64px;padding:10px 6px}.cd b{display:block;font:800 28px 'Bricolage Grotesque'}.cd small{font-size:11px;opacity:.8}
.tc{display:grid;gap:12px}@media(min-width:640px){.tc{grid-template-columns:repeat(2,1fr)}}@media(min-width:1024px){.tc{grid-template-columns:repeat(4,1fr)}}
.tc div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}.tc span{font-size:28px}.tc h3{font-size:18px;margin:8px 0 4px}.tc p{color:var(--mut);font-size:14px}
.rv{display:grid;gap:12px}@media(min-width:760px){.rv{grid-template-columns:repeat(3,1fr)}}
.rv div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}.rv b{color:#e0a100}.rv p{margin:8px 0}.rv small{color:var(--mut)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--hi);color:#10201c;font-weight:700;margin-right:8px}
.nl{background:var(--hi);color:#10201c;border-radius:28px;padding:36px 22px;text-align:center}.nl p{margin:10px auto 18px;max-width:520px}
.nl form{display:flex;gap:8px;max-width:480px;margin:auto;flex-wrap:wrap}.nl input{flex:1 1 220px;min-height:46px;border-radius:99px;border:0;padding:0 18px}.nl .btn{background:#10201c;color:#fff}
footer{background:#0b1b17;color:#cfe0da;margin-top:40px;padding:40px 0 20px}footer .fg{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}@media(min-width:800px){footer .fg{grid-template-columns:repeat(4,1fr)}}
footer h4{color:#fff;margin-bottom:10px}footer a{display:block;padding:5px 0;font-size:14px}footer a:hover{color:var(--hi)}footer small{display:block;margin-top:28px;text-align:center;opacity:.7}
#wa{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 20px #0004;z-index:60}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#10201c;color:#fff;padding:12px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
/* pages */
.pd{display:grid;gap:26px;padding-top:24px}@media(min-width:860px){.pd{grid-template-columns:1fr 1fr}}
.main-im{border-radius:var(--r);overflow:hidden;aspect-ratio:1;background:var(--line)}.main-im img{width:100%;height:100%;object-fit:cover}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.th button{width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid transparent;flex:none;padding:0;background:var(--line)}.th button.on{border-color:var(--pri)}
.info h1{font-size:clamp(26px,4vw,40px);margin:6px 0}.info .pr b{font-size:28px}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;font-size:14px;color:var(--mut)}
.q{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--card)}.q button{width:44px;height:44px;background:none;font-size:20px}.q span{min-width:28px;text-align:center;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;align-items:center}
.ct{display:grid;gap:12px}.ci{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}.ci img{border-radius:12px;aspect-ratio:1;object-fit:cover}
.two{display:grid;gap:24px}@media(min-width:900px){.two{grid-template-columns:1.4fr 1fr}}
.sum{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;height:fit-content}.sum p{display:flex;justify-content:space-between;padding:6px 0}.sum p.t{font:800 20px 'Bricolage Grotesque';border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.f{display:grid;gap:10px;grid-template-columns:1fr}.f label{display:grid;gap:4px;font-size:13px;color:var(--mut)}@media(min-width:560px){.f{grid-template-columns:1fr 1fr}.f .w{grid-column:1/-1}}
.f input,.f select,.f textarea,.inp{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 14px}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:6px 0;min-height:46px}.opt input{width:20px;height:20px}
table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{min-height:40px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line)}.tabs button.on{background:var(--pri);color:#fff}
.demo{background:#fff6c9;color:#5a4a00;padding:10px 14px;border-radius:12px;font-size:13px;margin:10px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

#ab{background:var(--pri);color:#fff;text-align:center;font-size:13px;font-weight:500;padding:7px 12px}#ab:empty{display:none}
header .ms{display:block;max-width:none;padding:0 0 10px}header .ms input{height:42px}
@media(min-width:900px){header .ms{display:none}}
@media(max-width:899px){.top{gap:0;height:56px}.logo{font-size:21px;margin-right:auto;margin-left:4px}.sp,.top>.cs{display:none}.ic{width:42px;height:42px}}
#mm .cs{width:100%;height:46px;margin-top:12px}
.hero{background:radial-gradient(900px 400px at 85% 0,color-mix(in srgb,var(--hi) 35%,transparent),transparent)}
.himg{border-radius:28px;overflow:hidden;aspect-ratio:1.1;box-shadow:0 24px 50px #0a2a2230}.himg img{width:100%;height:100%;object-fit:cover}
.btn{letter-spacing:.02em;box-shadow:0 1px 0 #0001}.btn:active{transform:scale(.97)}
.card{border-radius:20px}.im img{transition:transform .6s}.card:hover .im img{transform:scale(1.07)}
.cb h3{min-height:2.6em}.pr b{font-size:19px;letter-spacing:-.01em}.pr i{background:#d63f3f18;padding:2px 7px;border-radius:99px}
.bd i{box-shadow:0 2px 6px #0003}.heart{transition:.2s}.heart:hover{transform:scale(1.12)}
.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000a)}.cat b{z-index:1}
.dm{font:700 10px/1 'DM Sans';background:#fff6c9;color:#5a4a00;padding:3px 6px;border-radius:99px;margin-left:auto}
.opt{transition:.2s}.opt:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--card))}
.kp{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin:14px 0}@media(min-width:760px){.kp{grid-template-columns:repeat(4,1fr)}}.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.kp b{display:block;font:800 26px 'Bricolage Grotesque'}
.tabs{overflow-x:auto;flex-wrap:nowrap}.tabs>*{flex:none}
footer .fg a{min-height:32px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.ch h3{font-size:15px;margin-bottom:4px}
.fn{margin:10px 0;font-size:14px}.fn i{display:block;height:10px;border-radius:99px;background:var(--pri);margin-top:5px;min-width:3px}.fn span{color:var(--mut)}
.an h3.sec{margin:26px 0 8px;font-size:20px}.an .kp b{font-size:22px}.st{font:700 11px 'DM Sans';padding:3px 8px;border-radius:99px;background:var(--line)}
.adm{display:block}.side{display:flex;gap:6px;overflow-x:auto;margin:14px 0}.side button{flex:none;min-height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);text-align:left;font-weight:500}.side button.on{background:var(--pri);color:#fff}.admc{min-width:0}
@media(min-width:900px){.adm{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;margin-top:10px}.side{flex-direction:column;overflow:visible;margin:0;position:sticky;top:90px;align-self:start}.side button{border-radius:12px;width:100%}}
.cg{display:grid;gap:10px}@media(min-width:900px){.cg{grid-template-columns:1fr 1fr}}.th2{display:inline-block;width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--line);vertical-align:middle;margin-right:6px}.th2 img{width:100%;height:100%;object-fit:cover}
section h1{font-size:clamp(24px,4vw,36px);margin-bottom:22px}details.hm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}details.hm summary{cursor:pointer;font-weight:700;min-height:32px}details.hm li{margin:6px 0 6px 18px}
table select{min-height:42px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
</style>

<header><div id="ab"></div><div class="wrap"><div class="top">
<button class="ic" id="hb" aria-label="Menu" data-menu>☰</button>

<script>
/* =====================================================================
   CLEANCART — HOW TO EDIT (no coding needed, just change the values)
   1) CONFIG below    → store name, logo, WhatsApp, payments, shipping,
                        currencies, countries, banners, deal timer, coupons
   2) CATEGORIES      → add/remove categories (one line each)
   3) PRODUCTS        → add a product = copy one block, change values.
                        Prices are in USD; the site converts to SAR/GBP.
   Images: "ph:🎧:#1d4ed8" is a demo placeholder. Replace with a real
   link ("images/shoe.jpg") or upload inside Admin (#/admin).
   NOTE: Admin edits are saved in the visitor's own browser (demo mode).
   For a live store, copy final data into this file or connect a backend.
   ===================================================================== */
const CONFIG = {
  storeName: "CleanCart",
  description: "Trending products, everyday essentials and clever finds delivered to your door.",
  logoText: "CleanCart",                 // or set logoImage: "images/logo.png"
  logoImage: "",
  whatsapp: "966500000000",              // digits only, with country code
  adminPassword: "admin123",             // CHANGE THIS (client-side only, demo level)
  newsletterPct: 10,                     // "10% off first order"
  currencies: { USD:{rate:1}, SAR:{rate:3.75}, GBP:{rate:0.79} },   // rate = per 1 USD
  countries: {                           // add a country = add a line
    US:{name:"United States", currency:"USD", whatsapp:"", payments:["card","paypal","stripe","applepay","googlepay","bank","whatsapp"]},
    GB:{name:"United Kingdom", currency:"GBP", whatsapp:"", payments:["card","paypal","stripe","applepay","googlepay","bank","whatsapp"]},
    SA:{name:"Saudi Arabia", currency:"SAR", whatsapp:"966500000000", payments:null}   /* payments:null = all enabled methods; whatsapp:"" = use main number */
  },
  defaultCountry: "US",
  shipping: {                            // prices in USD per country
    US:{freeOver:60, methods:[{id:"std",name:"Standard (5–8 days)",price:5.99},{id:"exp",name:"Express (2–4 days)",price:14.99}]},
    GB:{freeOver:60, methods:[{id:"std",name:"Standard (4–7 days)",price:4.99},{id:"exp",name:"Express (2–3 days)",price:12.99}]},
    SA:{freeOver:50, methods:[{id:"std",name:"Standard (5–9 days)",price:4.5},{id:"exp",name:"Express (2–4 days)",price:11}]}
  },
  payments: {                            // enabled:true/false. Fill keys later.
    card:{enabled:true,label:"Credit / Debit Card",keys:{publicKey:"",secretKey:""}},
    paypal:{enabled:true,label:"PayPal",keys:{clientId:""}},
    stripe:{enabled:false,label:"Stripe",keys:{publishableKey:""}},
    applepay:{enabled:false,label:"Apple Pay",keys:{merchantId:""}},
    googlepay:{enabled:false,label:"Google Pay",keys:{merchantId:""}},
    cod:{enabled:true,label:"Cash on Delivery",keys:{}},
    bank:{enabled:true,label:"Bank Transfer",keys:{details:"Bank: ____  IBAN: ____"}},
    whatsapp:{enabled:true,label:"WhatsApp Order",keys:{}}
  },
  banners: { heroTitle:"Discover Smart Products. Shop Better. Live Better.",
    heroSub:"Trending products, everyday essentials and clever finds — carefully selected and delivered to your door.",
    heroImage:"", cta1:"SHOP NOW", cta2:"EXPLORE PRODUCTS", promo:"Free shipping on orders over $60 · Use code SAVE10" },
  deal: { enabled:true, endsAt:null, title:"LIMITED-TIME DEALS", text:"Upgrade your everyday life without overspending." }, // endsAt: "2026-12-31T23:59"
  analytics:{mode:"demo",base:"USD",abandonMin:30,ga:"",plausible:"",posthog:"",endpoint:""},  // production analytics placeholders (nothing is sent in demo mode)
  social: {Facebook:"#",Instagram:"#",TikTok:"#"}
};
const CATEGORIES = [                     // [slug, name, emoji, color]
  ["beauty","Beauty & Personal Care","💄","#c2417a"],["home","Home & Kitchen","🍳","#b8631f"],
  ["electronics","Electronics","🎧","#2455c6"],["accessories","Accessories","⌚","#6b4fc2"],
  ["fashion","Fashion","👟","#17806b"],["fitness","Health & Fitness","🏋️","#c23d3d"],
  ["gadgets","Gadgets","🔦","#0e7490"],["trending","Trending","🔥","#9a3412"]]  // optional 5th/6th values: image URL, description;
// PRODUCTS: price = original USD, sale = discounted USD (leave equal for no sale)
const PRODUCTS = [

 <details class="hm"><summary>How metrics are calculated</summary><ul><li><b>Visitors</b> = distinct anonymous visitor IDs (random ID kept in this browser) with any event in the date range.</li><li><b>Sessions</b> = distinct anonymous session IDs (a new one per browser tab session). <b>Returning visitors</b> = visitors whose session began when this browser already had an earlier session.</li><li><b>Page views / Product views / Add to cart / Checkout started</b> = number of those events (+ and − buttons in the cart count as add/remove events).</li><li><b>Orders</b> = number of order_completed events. <b>Revenue</b> = sum of order totals (after discount, including shipping), stored in USD and converted to the Analytics Base Currency using the rates in Settings.</li><li><b>Conversion rate</b> = sessions with an order_completed event ÷ sessions. In country and device tables, each event is grouped by the country/device recorded on that event, and conversion = sessions with an order ÷ sessions in that group.</li><li><b>Bounce rate</b> = sessions with at most 1 page view and no other event ÷ sessions.</li><li><b>Average session duration</b> = average of (last event time − first event time) per session.</li><li><b>Funnel</b> = sessions that triggered each event; % = step ÷ product-view sessions; drop-off = 100% − (step ÷ previous step), never below 0. Shipping/payment are counted when chosen, or when the order is placed with the default option.</li><li><b>Product conversion</b> = orders ÷ unique viewers of that product. <b>Abandoned cart</b> = cart with items, no completed order, and no activity for ${abMin()}+ minutes (set in Settings).</li></ul></details>`}

function shrink(f,cb,max=900){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);try{cb(c.toDataURL("image/jpeg",.82))}catch(e){cb(r.result)}};i.onerror=()=>cb(r.result);i.src=r.result};r.readAsDataURL(f)}
/* Admin password is compared as a SHA-256 hash once changed. Still browser-only: NOT real security. */
async function hashPw(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("cc:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of "cc:"+p)h=(h*33^ch.charCodeAt(0))>>>0;return"d"+h}}
