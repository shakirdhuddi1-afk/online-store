<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Store Admin</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#10201c;--mut:#5d6b66;--line:#dfe5e2;--pri:#0b5d4b;--red:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0c1512;--card:#14201c;--ink:#eef4f1;--mut:#9fb0a9;--line:#24352f;--pri:#2fb98e;--red:#ff7a6b}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:8px 0 16px}h2{font-size:17px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
textarea{min-height:70px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:#fff;cursor:pointer;margin-top:12px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.d{background:transparent;color:var(--red);border:1px solid var(--line)}
button.s{padding:7px 12px;margin:0;font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--line)}
.row .t{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}.off{opacity:.5}
.bar{display:flex;justify-content:space-between;align-items:center}
#msg{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;display:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.hide{display:none}
</style>
</head>
<body>
<h1>Store Admin</h1>

<!-- Login -->
<div id="login" class="card">
  <h2>Sign in</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="loginBtn">Sign in</button>
</div>

<!-- App -->
<div id="app" class="hide">
  <div class="bar" style="margin-bottom:12px"><span id="who" style="color:var(--mut);font-size:14px"></span><button class="g s" id="out">Sign out</button></div>

  <div class="card">
    <h2>Store name</h2>
    <label>Name</label><input id="sn">
    <label>Tagline</label><input id="tg">
    <button id="saveSet">Save store name</button>
  </div>

  <div class="card">
    <div class="bar"><h2 id="fh">Add product</h2></div>
    <input type="hidden" id="pid">
    <label>Product name</label><input id="pn">
    <label>Price</label><input id="pp" type="number" step="0.01" inputmode="decimal">
    <label>Image link (https://...)</label><input id="pi" type="url">
    <label>Description</label><textarea id="pd"></textarea>
    <button id="saveP">Save product</button>
    <button class="g" id="clr">Clear</button>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="list"><small style="color:var(--mut)">No products yet. Add your first one above.</small></div>
  </div>
</div>
<div id="msg" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// === Yahan apni Supabase details paste karo ===
const SUPABASE_URL = "https://lfbwswsnaiwmjqakolyr.supabase.co";
const SUPABASE_KEY = "sb_publishable_lKu2uyYFQTKwpJ6uyb2SXw_O_iBZA1F";
// ==============================================
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let items = [];
function say(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',2600)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function show(){
  const {data:{session}} = await db.auth.getSession();
  $('login').classList.toggle('hide',!!session);
  $('app').classList.toggle('hide',!session);
  if(session){$('who').textContent=session.user.email;load()}
}
$('loginBtn').onclick=async()=>{
  const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error) return say('Sign in failed: '+error.message);
  show();
};
$('out').onclick=async()=>{await db.auth.signOut();show()};

async function load(){
  const s=await db.from('settings').select('*').eq('id',1).single();
  if(s.data){$('sn').value=s.data.store_name||'';$('tg').value=s.data.tagline||''}
  const p=await db.from('products').select('*').order('created_at',{ascending:false});
  if(p.error) return say('Could not load products: '+p.error.message);
  items=p.data;render();
}
function render(){
  if(!items.length){$('list').innerHTML='<small style="color:var(--mut)">No products yet. Add your first one above.</small>';return}
  $('list').innerHTML=items.map(x=>`<div class="row ${x.active?'':'off'}">
    <img src="${esc(x.image)}" alt="" onerror="this.removeAttribute('src')">
    <div class="t"><b>${esc(x.name)}</b><small>${esc(x.price)}${x.active?'':' · hidden'}</small></div>
    <button class="g s" data-e="${x.id}">Edit</button>
    <button class="g s" data-v="${x.id}">${x.active?'Hide':'Show'}</button>
    <button class="d s" data-d="${x.id}">Delete</button></div>`).join('');
}
$('list').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e){const x=items.find(i=>i.id==b.dataset.e);
    $('pid').value=x.id;$('pn').value=x.name;$('pp').value=x.price;$('pi').value=x.image||'';$('pd').value=x.description||'';
    $('fh').textContent='Edit product';scrollTo({top:0,behavior:'smooth'})}
  if(b.dataset.v){const x=items.find(i=>i.id==b.dataset.v);
    const r=await db.from('products').update({active:!x.active}).eq('id',x.id);
    r.error?say(r.error.message):(say(x.active?'Hidden':'Visible'),load())}
  if(b.dataset.d){if(!confirm('Delete this product?'))return;
    const r=await db.from('products').delete().eq('id',b.dataset.d);
    r.error?say(r.error.message):(say('Deleted'),load())}
};
function clear(){['pid','pn','pp','pi','pd'].forEach(i=>$(i).value='');$('fh').textContent='Add product'}
$('clr').onclick=clear;
$('saveP').onclick=async()=>{
  const row={name:$('pn').value.trim(),price:parseFloat($('pp').value)||0,image:$('pi').value.trim(),description:$('pd').value.trim()};
  if(!row.name) return say('Enter a product name');
  const id=$('pid').value;
  const r=id?await db.from('products').update(row).eq('id',id):await db.from('products').insert(row);
  if(r.error) return say('Save failed: '+r.error.message);
  say('Saved');clear();load();
};
$('saveSet').onclick=async()=>{
  const r=await db.from('settings').update({store_name:$('sn').value.trim(),tagline:$('tg').value.trim()}).eq('id',1);
  say(r.error?'Save failed: '+r.error.message:'Saved');
};
show();
</script>
</body>
</html>
